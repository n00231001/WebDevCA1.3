
name: Dropbox Rollback

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Commit SHA to restore (leave empty to use previous version)"
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  rollback:
    name: Rollback production
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Send rollback command to EC2
        shell: bash
        env:
          INSTANCE_ID: ${{ vars.INSTANCE_ID }}
          ROLLBACK_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          # Validate a supplied commit SHA.
          if [ -n "$ROLLBACK_TAG" ]; then
            if ! [[ "$ROLLBACK_TAG" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Error: Enter a valid 40-character commit SHA."
              exit 1
            fi
          fi

          # Encode the rollback script.
          SCRIPT_B64=$(base64 -w 0 scripts/rollback.sh)

          # Transfer and execute the script on EC2.
          REMOTE_COMMAND="echo ${SCRIPT_B64} | base64 -d > /tmp/dropbox-rollback.sh && chmod +x /tmp/dropbox-rollback.sh"

          if [ -n "$ROLLBACK_TAG" ]; then
            REMOTE_COMMAND="${REMOTE_COMMAND} && /tmp/dropbox-rollback.sh ${ROLLBACK_TAG}"
          else
            REMOTE_COMMAND="${REMOTE_COMMAND} && /tmp/dropbox-rollback.sh"
          fi

          PARAMETERS=$(jq -n --arg command "$REMOTE_COMMAND" \
            '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Manual Dropbox production rollback" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          # Wait for rollback to finish.
          STATUS="Pending"

          for attempt in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Rollback status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              break
            fi

            if [[ "$STATUS" =~ ^(Failed|Cancelled|TimedOut|DeliveryTimedOut|ExecutionTimedOut)$ ]]; then
              break
            fi

            sleep 10
          done

          # Display the rollback output.
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
            --output json

          if [ "$STATUS" != "Success" ]; then
            echo "Rollback failed or timed out."
            exit 1
          fi
