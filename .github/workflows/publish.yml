name: Dropbox Publish

on:
  workflow_run:
    workflows: ["Dropbox CI"]
    types:
      - completed
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Build and push Docker images
    runs-on: ubuntu-latest

    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check GitHub OIDC claims
        shell: bash
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')

          python3 -c '
          import base64, json, sys
          payload = sys.argv[1].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print(json.dumps({
              "sub": claims.get("sub"),
              "aud": claims.get("aud"),
              "repository": claims.get("repository"),
              "ref": claims.get("ref")
          }, indent=2))
          ' "$TOKEN"

          unset TOKEN

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/dropbox-backend:latest
            ${{ steps.login-ecr.outputs.registry }}/dropbox-backend:${{ github.event.workflow_run.head_sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/dropbox-frontend:latest
            ${{ steps.login-ecr.outputs.registry }}/dropbox-frontend:${{ github.event.workflow_run.head_sha }}

      
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: publish

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Send deployment command to EC2
        shell: bash
        env:
          INSTANCE_ID: ${{ vars.INSTANCE_ID }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # Encode the deployment script so it can be sent safely to EC2.
          SCRIPT_B64=$(base64 -w 0 scripts/deploy.sh)

          # Prepare the command that EC2 will execute.
          REMOTE_COMMAND="echo ${SCRIPT_B64} | base64 -d > /tmp/dropbox-deploy.sh && chmod +x /tmp/dropbox-deploy.sh && /tmp/dropbox-deploy.sh ${IMAGE_TAG}"

          PARAMETERS=$(jq -n --arg command "$REMOTE_COMMAND" \
            '{commands: [$command]}')

          # Send the command to EC2 through Systems Manager.
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Dropbox application" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          # Wait for deployment to finish.
          STATUS="Pending"

          for attempt in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              break
            fi

            if [[ "$STATUS" =~ ^(Failed|Cancelled|TimedOut|DeliveryTimedOut|ExecutionTimedOut)$ ]]; then
              break
            fi

            sleep 10
          done

          # Display the deployment output.
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
            --output json

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed or timed out."
            exit 1
          fi
